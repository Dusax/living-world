name: Publicar Mundo Vivo no GitHub Pages
on:
  push:
    branches: [main, claude/affectionate-darwin-hqpp0w]   # a branch padrão atual deste repo; "main" vale se você renomear
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes da simulação
        run: node --test living-world/test/*.test.js
      - name: Montar o site (só os arquivos do jogo)
        run: |
          mkdir _site
          cp living-world/index.html living-world/style.css _site/
          cp -r living-world/src _site/src
          cp living-world/minds.enc.json _site/ 2>/dev/null || true   # cofre criptografado das mentes (opcional)
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
